# 🧩LKmini 分支自動部署 GitHub Pages
name: 🧩LKmini 自動部署 Jekyll Pages

on:
  push:
    branches: ["🧩LKmini"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-lkmini"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取回程式碼
        uses: actions/checkout@v4
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 建置 Jekyll 範本
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: 上傳建置成果
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
